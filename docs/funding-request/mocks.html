<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pedido de plata — mock</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --chg-espresso: #2A1A14;
      --chg-sunflower: #F4B942;
      --chg-arcilla: #E07A5F;
      --chg-offwhite: #FAFAF7;
      --border: rgba(42, 26, 20, 0.16);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #efe8df;
      color: var(--chg-espresso);
      font: 16px/1.45 Inter, Nunito, system-ui, sans-serif;
    }
    header.page {
      padding: 28px 24px 8px;
      max-width: 1100px;
      margin: 0 auto;
    }
    header.page h1 { font-size: 28px; margin: 0 0 8px; }
    header.page p { margin: 0; max-width: 62ch; }
    .board {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      max-width: 1100px;
      margin: 0 auto;
      padding: 20px 24px 48px;
    }
    figure { margin: 0; }
    figcaption {
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 8px;
    }
    .stage {
      background: var(--chg-offwhite);
      border-radius: 16px;
      padding: 16px;
    }
    .cart {
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 14px;
      background: white;
    }
    .cart h2 { font-size: 17px; margin: 0 0 8px; }
    .line { display: flex; justify-content: space-between; margin: 6px 0; }
    .total { display: flex; justify-content: space-between; font-weight: 700; margin-top: 12px; }
    .balance {
      margin: 12px 0 0;
      font-weight: 600;
    }
    .actions { display: flex; gap: 8px; margin-top: 12px; }
    button, a.btn {
      font: inherit;
      font-weight: 700;
      min-height: 44px;
      min-width: 44px;
      border-radius: 999px;
      padding: 10px 18px;
      border: 2px solid transparent;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    button:focus-visible, a:focus-visible, input:focus-visible {
      outline: 2px solid var(--chg-espresso);
      outline-offset: 2px;
    }
    .btn-pay { background: var(--chg-sunflower); color: var(--chg-espresso); flex: 1; }
    .btn-ghost {
      background: transparent;
      color: var(--chg-espresso);
      border-color: var(--border);
      flex: 1;
    }
    .backdrop {
      background: rgba(42, 26, 20, 0.45);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      border-radius: 16px;
      min-height: 560px;
    }
    .modal {
      width: min(420px, 100%);
      background: var(--chg-offwhite);
      color: var(--chg-espresso);
      border-radius: 16px;
      padding: 16px 16px 20px;
    }
    .modal-head { display: flex; align-items: center; gap: 8px; }
    .modal-head h2 { font-size: 20px; margin: 0; flex: 1; }
    .modal-x {
      width: 44px;
      height: 44px;
      padding: 0;
      background: transparent;
      border: 0;
      color: var(--chg-espresso);
      font-size: 28px;
      line-height: 1;
    }
    label { display: block; font-weight: 600; font-size: 14px; margin-top: 12px; }
    input {
      width: 100%;
      min-height: 44px;
      margin-top: 4px;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 8px 12px;
      font: inherit;
      color: var(--chg-espresso);
      background: white;
    }
    .amount { font-size: 28px; font-weight: 700; margin: 8px 0 0; }
    .hint { margin: 8px 0 0; font-size: 14px; }
    .qr {
      width: 200px;
      height: 200px;
      margin: 16px auto;
      display: grid;
      grid-template-columns: repeat(9, 1fr);
      gap: 3px;
      background: white;
      padding: 10px;
      border-radius: 12px;
      border: 1px solid var(--border);
    }
    .qr i { display: block; background: transparent; }
    .qr i.on { background: var(--chg-espresso); }
    .pay-link { display: flex; margin: 0 auto; width: fit-content; }
    .live { min-height: 1.4em; font-weight: 600; text-align: center; }
    .ok { font-size: 18px; font-weight: 700; margin: 24px 0; text-align: center; }
    .page-b { background: var(--chg-offwhite); }
    @media (max-width: 800px) {
      .board { grid-template-columns: 1fr; }
      .actions { flex-direction: column; }
    }
  </style>
</head>
<body>
  <header class="page">
    <h1>Pedido de plata</h1>
    <p>Borrador para aprobar. Cuatro estados del mismo flujo. El código dibujado no es un QR de cobro.</p>
  </header>
  <div class="board">
    <figure>
      <figcaption>1 · Carrito, 390 y 1440</figcaption>
      <div class="stage">
        <section class="cart" aria-label="Carrito">
          <h2>Tu changuito</h2>
          <div class="line"><span>Leche</span><span>$1.850</span></div>
          <div class="line"><span>Pan</span><span>$1.200</span></div>
          <div class="total"><span>Total</span><span>$3.050</span></div>
          <div class="actions">
            <button type="button" class="btn-pay" data-testid="cart-pay">Proceder al pago</button>
            <button type="button" class="btn-ghost" data-testid="funding-request">Pedir este pago</button>
          </div>
        </section>
      </div>
    </figure>

    <figure>
      <figcaption>2 · Modal de A, centrado</figcaption>
      <div class="stage">
        <div class="backdrop">
          <section class="modal" role="dialog" aria-modal="true" aria-labelledby="t-a" data-testid="funding-modal">
            <header class="modal-head">
              <h2 id="t-a">Pedido de plata</h2>
              <button type="button" class="modal-x" aria-label="Cerrar">×</button>
            </header>
            <p class="amount">$3.050</p>
            <p class="hint">Se acreditan 3 USDC en tu saldo.</p>
            <label for="funding-email">Email</label>
            <input id="funding-email" type="email" autocomplete="email" inputmode="email" value="bia@example.com" />
            <div class="qr" role="img" aria-label="Código de Mercado Pago por $3.050.">
              <i class="on"></i><i class="on"></i><i class="on"></i><i></i><i class="on"></i><i></i><i class="on"></i><i class="on"></i><i class="on"></i>
              <i class="on"></i><i></i><i class="on"></i><i></i><i></i><i></i><i class="on"></i><i></i><i class="on"></i>
              <i class="on"></i><i class="on"></i><i class="on"></i><i></i><i class="on"></i><i></i><i class="on"></i><i class="on"></i><i class="on"></i>
              <i></i><i></i><i></i><i></i><i class="on"></i><i></i><i></i><i></i><i></i>
              <i class="on"></i><i></i><i class="on"></i><i class="on"></i><i></i><i class="on"></i><i></i><i class="on"></i><i></i>
              <i></i><i></i><i></i><i></i><i class="on"></i><i></i><i></i><i></i><i></i>
              <i class="on"></i><i class="on"></i><i class="on"></i><i></i><i></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i>
              <i class="on"></i><i></i><i class="on"></i><i></i><i class="on"></i><i></i><i class="on"></i><i></i><i class="on"></i>
              <i class="on"></i><i class="on"></i><i class="on"></i><i></i><i></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i>
            </div>
            <p class="hint" style="text-align:center">Prueba de Mercado Pago</p>
            <a class="btn btn-ghost pay-link" href="#mercadopago">Abrir Mercado Pago</a>
            <p class="live" aria-live="polite">Esperando el pago…</p>
          </section>
        </div>
      </div>
    </figure>

    <figure>
      <figcaption>3 · B pagó y puede cerrar</figcaption>
      <div class="stage page-b">
        <div class="backdrop">
          <section class="modal" role="dialog" aria-modal="true" aria-labelledby="t-b" data-testid="funding-modal">
            <header class="modal-head">
              <h2 id="t-b">Pedido de plata</h2>
              <button type="button" class="modal-x" aria-label="Cerrar">×</button>
            </header>
            <p class="ok">Listo. El pago entró.</p>
            <button type="button" class="btn-pay" data-testid="funding-done" style="width:100%">Listo</button>
          </section>
        </div>
      </div>
    </figure>

    <figure>
      <figcaption>4 · A ve el saldo y sigue</figcaption>
      <div class="stage">
        <section class="cart" aria-label="Carrito con saldo">
          <h2>Tu changuito</h2>
          <div class="line"><span>Leche</span><span>$1.850</span></div>
          <div class="line"><span>Pan</span><span>$1.200</span></div>
          <div class="total"><span>Total</span><span>$3.050</span></div>
          <p class="balance" data-testid="funding-balance">Tu saldo: 3 USDC</p>
          <div class="actions">
            <button type="button" class="btn-pay" data-testid="cart-pay">Proceder al pago</button>
            <button type="button" class="btn-ghost" data-testid="funding-request">Pedir este pago</button>
          </div>
        </section>
      </div>
    </figure>
  </div>
</body>
</html>
